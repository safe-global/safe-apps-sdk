name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

permissions: {}

jobs:
  CLAAssistant:
    # Runs under pull_request_target with secrets: never check out or run code from the PR.
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      actions: write # re-run the failed check after "recheck"/signing
      contents: read
      pull-requests: write # post and update the signing comment
      issues: write
    steps:
      - name: Checkout reusable workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: safe-global/github-reusable-workflows
          token: ${{ secrets.REUSABLE_WORKFLOWS_TOKEN }}
          path: reusable-workflows
          ref: 14b67a16428ed67f54ea459111608c0a4ce76d38 # v2.4.59
          persist-credentials: false
      - name: "CLA Assistant"
        uses: ./reusable-workflows/actions/cla
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-id: ${{ secrets.CLA_APP_ID }}
          app-private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          allowlist: germartinez,rmeissner,Uxio0,dasanra,luarx,DaniSomoza,katspaugh,yagopv,JagoFigueroa,bot*
